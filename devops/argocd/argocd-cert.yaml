apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-cert
  namespace: argo-cd
spec:
  isCA: false
  commonName: TJ PengAn Argo-CD
  secretName: argocd-server-tls # 此处证书名称是helm values中固定名称
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 2160h # 90d
  renewBefore: 72h # 3d
  subject:
    organizations:
      - TJ PengAn .Ltd
  dnsNames:
    - argocd.tjpengan.local
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
