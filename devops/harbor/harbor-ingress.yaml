apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-cert
  namespace: harbor
spec:
  isCA: false
  commonName: Example harbor
  secretName: harbor-secret
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 2160h # 90d
  renewBefore: 72h # 3d
  subject:
    organizations:
      - Example .Inc
  dnsNames:
    - harbor.example.local
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor-websecure
  namespace: harbor
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`harbor.example.local`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: harbor-portal
          port: 80
  tls:
    secretName: harbor-secret
---
