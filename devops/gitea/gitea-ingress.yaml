apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-cert
  namespace: gitea
spec:
  isCA: false
  commonName: Example gitea
  secretName: gitea-secret
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 2160h # 90d
  renewBefore: 72h # 3d
  subject:
    organizations:
      - Example .Inc
  dnsNames:
    - gitea.example.local
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea-websecure
  namespace: gitea
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitea.example.local`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: gitea-http
          passHostHeader: true
          port: 3000
  tls:
    secretName: gitea-secret
